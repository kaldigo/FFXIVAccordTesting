name: Validate testing workspace
on:
  push:
    branches: [main]
    paths-ignore: ['pluginmaster.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/workspace.py
      - name: Check scaffold cannot publish an empty implementation
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'tools'); from workspace import config; assert config()['project'] is None"
          if ($LASTEXITCODE) { throw 'Replace this scaffold check when a client implementation is requested' }
